      do: Request investor access and confirm the account route reads the request as pending
      cov: C-OV-02
    - kind: browser
      do: Sign in as the approved account, open the document room and confirm the three documents are listed
    - kind: browser
      do: Sign in as the pending account, open the same address and confirm the not-found page
      cov: C-UF-11, C-UF-25

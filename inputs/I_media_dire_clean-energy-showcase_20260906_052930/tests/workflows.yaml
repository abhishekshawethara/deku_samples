    - kind: pytest
      test: test_showcase.py::test_one_account_never_reads_another_enquiry_list
      critical: true
    - kind: pytest
      test: test_showcase.py::test_one_account_never_reads_another_access_request
      critical: true
    - kind: pytest
      test: test_showcase.py::test_a_save_belonging_to_another_account_cannot_be_deleted
      critical: true

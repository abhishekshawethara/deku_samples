      do: Open the newsroom and confirm the heading over one featured story raised above a wall of three cards, each with a plate and where it ran
      cov: C-UF-12, C-FE-88, C-FE-89, C-FE-90, C-FE-91
    - kind: browser
      do: Press the more action and confirm the next three stories arrive
    - kind: browser
      do: Open one story and confirm the full text
      cov: C-UF-13
    - kind: browser
      do: Open the careers route and confirm the heading, the culture story, the three open jobs and the Operations Academy
      cov: C-UF-14, C-FE-94, C-FE-95, C-FE-96, C-FE-99
    - kind: browser
      do: Press apply on one job and confirm the short form opens in the shared modal
      cov: C-FE-97
    - kind: browser
      do: Confirm the apply form offers no file input and no attachment control
      cov: C-FE-100
    - kind: browser
      do: Open the questions route and confirm the searchable list of common questions
      cov: C-UF-16
    - kind: pytest
      test: test_showcase.py::test_seven_stories_are_seeded_with_one_featured
      critical: true
    - kind: pytest
      test: test_showcase.py::test_the_story_list_pages_three_at_a_time
      critical: true
    - kind: pytest
      test: test_showcase.py::test_the_second_story_page_carries_different_stories
    - kind: pytest
      test: test_showcase.py::test_one_story_answers_with_its_body
    - kind: pytest
      test: test_showcase.py::test_three_jobs_are_seeded_with_the_academy_named
    - kind: pytest
      test: test_showcase.py::test_the_questions_answer_a_stranger_and_filter
    - kind: pytest
      test: test_showcase.py::test_an_application_is_stored_against_its_job
      critical: true
    - kind: pytest
      test: test_showcase.py::test_applying_twice_to_one_job_updates_the_row
      critical: true
    - kind: pytest
      test: test_showcase.py::test_an_application_to_an_unknown_job_is_refused
    - kind: pytest
      test: test_showcase.py::test_an_application_reaches_the_applicant_with_the_job_title

      critical: true
    - kind: pytest
      test: test_showcase.py::test_concurrent_access_requests_leave_one_row
      critical: true
    - kind: pytest
      test: test_showcase.py::test_access_request_references_are_unique
    - kind: pytest
      test: test_showcase.py::test_seeded_access_requests_hold_their_pinned_states
    - kind: pytest
      test: test_showcase.py::test_the_document_room_answers_the_approved_account
      critical: true
    - kind: pytest
      test: test_showcase.py::test_the_document_room_is_denied_to_a_pending_account
      critical: true
    - kind: pytest
      test: test_showcase.py::test_the_document_room_is_denied_with_no_session
      critical: true
    - kind: pytest
      test: test_showcase.py::test_an_access_request_reaches_the_requester
      critical: true

- id: cross_account_rows_cannot_be_read

- id: unauthenticated_visitor_is_sent_to_sign_in
  purpose: A caller with no session reaches no private route and is sent to sign in with a return path
  substeps:
    - kind: browser
      do: With no session, open the account route and confirm the browser lands on the sign-in route carrying the return path
      cov: C-UF-20
    - kind: browser
      do: Sign in from there and confirm the browser lands back on the account route
      cov: C-UF-21
    - kind: browser
      do: Clear the session mid-visit and confirm the next protected route sends the visitor back to sign in
      cov: C-UF-24
    - kind: pytest
      test: test_showcase.py::test_every_private_list_is_denied_with_no_session
      critical: true
    - kind: pytest
      test: test_showcase.py::test_an_expired_token_is_refused
      critical: true

- id: calculator_returns_the_worked_figures
  purpose: A heat or power need becomes a module count, an annual energy figure and a carbon figure
  substeps:
    - kind: browser
      do: Open the calculator route, enter a thermal need and confirm the module count, the energy figure and the carbon figure appear beside a simple bar chart
      cov: C-UF-09, C-FE-108
    - kind: browser
      do: Enter a need one megawatt over a whole module and confirm the module count rises by one
    - kind: pytest
      test: test_showcase.py::test_the_calculator_returns_the_worked_rows
      critical: true
    - kind: pytest
      test: test_showcase.py::test_the_module_count_rounds_up
      critical: true
    - kind: pytest
      test: test_showcase.py::test_the_energy_figure_follows_the_modules_built
      critical: true
    - kind: pytest
      test: test_showcase.py::test_the_electrical_kind_uses_the_converted_module_output
    - kind: pytest
      test: test_showcase.py::test_a_need_of_zero_or_less_is_refused
    - kind: pytest
      test: test_showcase.py::test_a_calculator_kind_outside_the_pinned_pair_is_refused


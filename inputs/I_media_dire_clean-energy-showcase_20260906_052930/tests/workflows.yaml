- id: app_is_reachable_and_credentials_work
  purpose: The deployed app answers on its published origin and the documented accounts sign in
  substeps:
    - kind: browser
      do: Open the sign-in route and confirm the form asks for an email and a password only
      cov: C-UF-18
    - kind: browser
      do: Open the sign-up route and confirm a new account can be created from it
      cov: C-UF-19
    - kind: browser
      do: Sign in with the first account documented in the app user readme and confirm the account route opens
      cov: C-UF-17, C-UF-22
    - kind: browser
      do: Sign out and confirm the browser returns to the home route
      cov: C-UF-23
    - kind: browser
      do: Confirm the top bar carries the logo, the nine route labels and one Get in Touch action
      cov: C-FE-125, C-FE-126
    - kind: browser
      do: Confirm the foot of the route carries a get-in-touch invitation
      cov: C-FE-32
    - kind: pytest
      test: test_showcase.py::test_health_endpoint_answers_on_the_app_origin
      critical: true
    - kind: pytest
      test: test_showcase.py::test_the_app_root_carries_its_contract_deliverables
      critical: true
    - kind: pytest
      test: test_showcase.py::test_seeded_password_signs_every_account_in
      critical: true
    - kind: pytest
      test: test_showcase.py::test_seeded_accounts_carry_their_display_names
    - kind: pytest
      test: test_showcase.py::test_signup_creates_a_visitor_and_returns_a_token
      critical: true
    - kind: pytest
      test: test_showcase.py::test_password_is_never_returned_by_the_account_route
    - kind: pytest
      test: test_showcase.py::test_account_email_cannot_be_taken_twice

- id: visitor_browses_the_showcase_routes
  purpose: A stranger reads the home, company, technology, edge and team routes with no account
  substeps:
    - kind: browser
      do: Open the home route and confirm the reactor stands on the first screen under one huge display line reading Powering the World
      cov: C-UF-01, C-FE-50, C-FE-51
    - kind: browser
      do: Scroll the home route and confirm the reactor comes apart, exposing a fuel column, and the metal resolves into a line drawing
      cov: C-FE-03, C-FE-39, C-FE-40, C-FE-41, C-FE-45
    - kind: browser
      do: Confirm the three key facts appear beside the opened reactor naming the reactor type, the module output and the outlet temperature
      cov: C-FE-42, C-FE-43, C-FE-44
    - kind: browser
      do: Confirm the home route carries a passage about the company name and a row of industry cards
      cov: C-FE-53, C-FE-54
    - kind: browser
      do: Confirm each stage of the reactor sequence is also readable as plain written text
      cov: C-FE-46
    - kind: browser
      do: Open the company route and confirm the opening line, the vision, the mission, the naming story and the three offices
      cov: C-UF-02, C-FE-56, C-FE-57, C-FE-58, C-FE-59, C-FE-60, C-FE-61
    - kind: browser
      do: Open the technology route and confirm the cutaway with the fuel, the graphite, the helium, the digital copy, the safety case and the modules
      cov: C-UF-03, C-FE-62, C-FE-63, C-FE-64, C-FE-65, C-FE-66, C-FE-67, C-FE-68
    - kind: browser
      do: Drag the technology diagram, then tap one part, and confirm that part explains itself
      cov: C-FE-109, C-FE-110
    - kind: browser
      do: Open the edge route and confirm the modernized proven design, the temperature case, the modules and the business model
      cov: C-UF-04, C-FE-75, C-FE-76, C-FE-77, C-FE-78
    - kind: browser
      do: Open the team route and confirm the opening line over a grid of four leaders on soft tinted plates
      cov: C-UF-05, C-FE-79, C-FE-80, C-FE-81
    - kind: browser
      do: Open one leader profile link, then the view-bio action, and confirm the fuller description opens in the shared modal
      cov: C-FE-82, C-FE-83, C-FE-121, C-FE-122
    - kind: browser
      do: Move between two showcase routes and confirm the change does not reload the page and a cover sweeps across
      cov: C-FE-07
    - kind: browser
      do: Open the home route with scripting turned off and confirm the whole page arrives as complete HTML, then turn scripting back on and confirm only the filter row, the save control and the modals become interactive
      cov: C-TR-01, C-TR-02
    - kind: browser
      do: Confirm the bars, the words and the first view of the reactor are usable before the whole sequence has arrived, and that the heavier extras arrive only on reaching them
      cov: C-FE-123, C-FE-124
    - kind: browser
      do: Narrow the browser to a phone width and confirm the menu button opens a full panel
      cov: C-FE-31
    - kind: browser
      do: Open an address that was never a route and confirm the not-found card reads We cannot find that page and links home
      cov: C-FE-10, C-FE-11, C-FE-127
    - kind: pytest
      test: test_showcase.py::test_the_team_and_offices_answer_a_stranger
    - kind: pytest
      test: test_showcase.py::test_content_is_served_from_the_store_not_the_build

- id: visitor_filters_the_solutions_explorer
  purpose: A stranger narrows the eight industry solutions with the four filters and opens one
  substeps:
    - kind: browser
      do: Open the solutions route and confirm eight industry cards in a grid under a filter row offering an industry choice
      cov: C-UF-06, C-OV-01, C-OV-03, C-FE-69
    - kind: browser
      do: Choose the hydrogen output and the top temperature band, then confirm the count reads two of eight
      cov: C-CF-05
    - kind: browser
      do: Open one industry card and confirm the solution explains what the reactor does for that industry block by block
      cov: C-UF-07, C-FE-70
    - kind: browser
      do: Confirm the opened solution offers a save action and an enquire action
      cov: C-FE-71, C-FE-72
    - kind: browser
      do: Return to the home route and follow one of the four output links, then confirm the explorer arrives already filtered to that output
      cov: C-CF-08, C-FE-128
    - kind: browser
      do: Search the explorer in plain language and confirm the grid narrows to matching industries
      cov: C-FE-107
    - kind: browser
      do: Confirm the solutions grid also reads as a plain written list
      cov: C-FE-120
    - kind: pytest
      test: test_showcase.py::test_eight_solutions_are_seeded_with_their_pinned_slugs
      critical: true
    - kind: pytest
      test: test_showcase.py::test_every_solution_carries_a_legal_enum_triple
    - kind: pytest
      test: test_showcase.py::test_seeded_solution_attributes_match_the_pinned_table
    - kind: pytest
      test: test_showcase.py::test_solution_list_returns_every_solution_with_its_fields
    - kind: pytest
      test: test_showcase.py::test_solution_list_carries_the_match_count_header
    - kind: pytest
      test: test_showcase.py::test_two_filters_narrow_the_set_to_the_worked_pair
      critical: true
    - kind: pytest
      test: test_showcase.py::test_each_filter_narrows_the_set_left_by_the_last
    - kind: pytest
      test: test_showcase.py::test_filter_by_industry_reconciles_with_the_store
    - kind: pytest
      test: test_showcase.py::test_filter_by_deployment_reconciles_with_the_store
    - kind: pytest
      test: test_showcase.py::test_plain_language_search_matches_stored_solutions
    - kind: pytest
      test: test_showcase.py::test_one_solution_answers_with_its_long_copy
    - kind: pytest
      test: test_showcase.py::test_unknown_solution_slug_is_refused

- id: anonymous_save_is_claimed_at_signup
  purpose: A save made with no account follows the visitor into a new account
  substeps:
    - kind: browser
      do: With no account, save one industry solution and confirm the result appears in place as a banner
      cov: C-OV-04
    - kind: browser
      do: Sign up from the same browser and confirm the saved solution is waiting on the account route
      cov: C-OV-05, C-FE-104
    - kind: browser
      do: Confirm the account route lists the enquiries sent with the state of each
      cov: C-FE-105
    - kind: pytest
      test: test_showcase.py::test_anonymous_save_returns_a_token_and_survives_signup
      critical: true
    - kind: pytest
      test: test_showcase.py::test_claiming_a_save_token_empties_it
    - kind: pytest
      test: test_showcase.py::test_saving_one_solution_twice_adds_no_second_row
      critical: true
    - kind: pytest
      test: test_showcase.py::test_concurrent_saves_of_one_solution_leave_one_row
      critical: true
    - kind: pytest
      test: test_showcase.py::test_a_save_is_removed_by_its_owner
    - kind: pytest
      test: test_showcase.py::test_seeded_accounts_hold_their_pinned_saves
    - kind: pytest
      test: test_showcase.py::test_a_saved_search_is_stored_under_its_name
    - kind: pytest
      test: test_showcase.py::test_resaving_a_search_name_replaces_its_filters
    - kind: pytest
      test: test_showcase.py::test_a_saved_search_is_removed_by_its_owner
    - kind: pytest
      test: test_showcase.py::test_the_seeded_saved_search_is_stored_for_its_owner

- id: comparison_holds_four_saves_at_most
  purpose: The comparison takes four saved solutions and refuses a fifth
  substeps:
    - kind: browser
      do: Open the comparison route with four saved solutions and confirm four columns side by side
      cov: C-UF-08
    - kind: browser
      do: Add a fifth saved solution and confirm the refusal appears in place while four are still compared
    - kind: pytest
      test: test_showcase.py::test_comparison_returns_at_most_four_solutions
      critical: true
    - kind: pytest
      test: test_showcase.py::test_a_fifth_comparison_slug_is_refused
      critical: true

